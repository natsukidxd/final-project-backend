openapi: "3.0.0"
info:
  title: Auth API
  description: Node.js + TypeScript + Sequelize + PostgreSQL Authentication API
  version: "1.0.0"
servers:
  - url: http://localhost:4000
    description: Development server
paths:
  /accounts/register:
    post:
      tags:
        - Accounts
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                confirmPassword:
                  type: string
      responses:
        "200":
          description: Registration successful
  /accounts/verify-email:
    post:
      tags:
        - Accounts
      summary: Verify email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Verification successful
  /accounts/authenticate:
    post:
      tags:
        - Accounts
      summary: Authenticate and get JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Authentication successful
  /accounts/refresh-token:
    post:
      tags:
        - Accounts
      summary: Refresh JWT token using refresh token cookie
      responses:
        "200":
          description: Token refreshed
  /accounts/revoke-token:
    post:
      tags:
        - Accounts
      summary: Revoke a refresh token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token revoked
  /accounts/forgot-password:
    post:
      tags:
        - Accounts
      summary: Send password reset email
      responses:
        "200":
          description: Email sent
  /accounts/validate-reset-token:
    post:
      tags:
        - Accounts
      summary: Validate reset token
      responses:
        "200":
          description: Token valid
  /accounts/reset-password:
    post:
      tags:
        - Accounts
      summary: Reset password
      responses:
        "200":
          description: Password reset
  /accounts:
    get:
      tags:
        - Accounts
      summary: Get all accounts (Admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of accounts
  /accounts/{id}:
    get:
      tags:
        - Accounts
      summary: Get account by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account details
    put:
      tags:
        - Accounts
      summary: Update account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account updated
    delete:
      tags:
        - Accounts
      summary: Delete account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT